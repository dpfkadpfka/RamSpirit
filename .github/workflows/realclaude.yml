# 진짜 Claude 데스크톱 앱으로 점검 (realtest 브랜치)
name: RamSpirit 진짜 앱 점검

on:
  push:
    branches: [realtest]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  test:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - name: 만들기
        shell: cmd
        run: |
          set FW=%WINDIR%\Microsoft.NET\Framework64\v4.0.30319
          mkdir C:\t
          "%FW%\csc.exe" /nologo /target:winexe /optimize /codepage:65001 /win32icon:src\icon.ico /lib:"%FW%\WPF" /r:System.Windows.Forms.dll /r:System.Drawing.dll /r:WindowsBase.dll /r:UIAutomationClient.dll /r:UIAutomationTypes.dll /resource:src\icons\icon1.ico,icon1.ico /resource:src\icons\icon2.ico,icon2.ico /resource:src\icons\icon3.ico,icon3.ico /resource:src\icons\icon4.ico,icon4.ico /resource:src\icons\icon5.ico,icon5.ico /resource:src\icons\icon6.ico,icon6.ico /resource:src\icons\icon7.ico,icon7.ico /resource:src\icons\icon1.png,icon1.png /resource:src\icons\icon2.png,icon2.png /resource:src\icons\icon3.png,icon3.png /resource:src\icons\icon4.png,icon4.png /resource:src\icons\icon5.png,icon5.png /resource:src\icons\icon6.png,icon6.png /resource:src\icons\icon7.png,icon7.png /out:C:\t\RamSpirit.exe src\RamSpirit.cs
      - name: 진짜 앱 설치
        shell: pwsh
        run: |
          $ProgressPreference = 'SilentlyContinue'
          Invoke-WebRequest "https://claude.ai/api/desktop/win32/x64/exe/latest/redirect" -OutFile C:\t\ClaudeSetup.exe -UserAgent "Mozilla/5.0 (Windows NT 10.0; Win64; x64)"
          Get-Item C:\t\ClaudeSetup.exe | Select Length
          Start-Process C:\t\ClaudeSetup.exe -ArgumentList "--silent" -Wait
          Start-Sleep 20
          Get-ChildItem "$env:LOCALAPPDATA\AnthropicClaude" -ErrorAction SilentlyContinue | Select Name
          Get-ChildItem "$env:APPDATA\Microsoft\Windows\Start Menu\Programs" -Recurse | Where Name -match "Claude" | Select FullName
          Get-StartApps | Where Name -match "Claude"
          Get-Process | Where ProcessName -match "claude" | Select ProcessName, Id, MainWindowTitle
      - name: 점검
        shell: powershell
        run: ./test/real.ps1
      - name: 결과 올리기
        if: always()
        shell: bash
        run: |
          mkdir -p /tmp/o && cp -r /c/t/out/. /tmp/o/ || true
          cd /tmp/o && git init -q && git checkout -q -b realtest-out && git add -A
          git -c user.name=bot -c user.email=bot@x commit -qm "run ${{ github.run_id }}"
          git push -f "https://x-access-token:${{ secrets.GITHUB_TOKEN }}@github.com/${{ github.repository }}.git" realtest-out
