# src 폴더가 바뀌면 윈도우 실행 파일(RamSpirit.exe)을 만들어 깃허브 릴리스에 올린다.
# 버전은 src/RamSpirit.cs 안의 Updater.Version 값을 따른다. 같은 버전 릴리스가 이미 있으면 건너뛴다.
# 릴리스 설명은 CHANGELOG.md에서 그 버전 부분을 가져온다 (src를 올리기 전에 CHANGELOG.md에 먼저 적어 둘 것).
name: RamSpirit 만들기

on:
  push:
    branches: [main]
    paths: ['src/**', '.github/workflows/**']
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4

      - name: 버전 읽기
        id: v
        shell: pwsh
        run: |
          $m = Select-String -Path src/RamSpirit.cs -Pattern 'public const string Version = "([0-9]+\.[0-9]+\.[0-9]+)"'
          if (-not $m) { Write-Error '버전을 찾지 못했어요'; exit 1 }
          "version=$($m.Matches[0].Groups[1].Value)" >> $env:GITHUB_OUTPUT

      - name: 실행 파일 만들기
        shell: cmd
        run: |
          set FW=%WINDIR%\Microsoft.NET\Framework64\v4.0.30319
          "%FW%\csc.exe" /nologo /target:winexe /optimize /codepage:65001 /win32icon:src\icon.ico /lib:"%FW%\WPF" /r:System.Windows.Forms.dll /r:System.Drawing.dll /r:WindowsBase.dll /r:UIAutomationClient.dll /r:UIAutomationTypes.dll /resource:src\icons\icon1.ico,icon1.ico /resource:src\icons\icon2.ico,icon2.ico /resource:src\icons\icon3.ico,icon3.ico /resource:src\icons\icon4.ico,icon4.ico /resource:src\icons\icon5.ico,icon5.ico /resource:src\icons\icon6.ico,icon6.ico /resource:src\icons\icon7.ico,icon7.ico /resource:src\icons\icon1.png,icon1.png /resource:src\icons\icon2.png,icon2.png /resource:src\icons\icon3.png,icon3.png /resource:src\icons\icon4.png,icon4.png /resource:src\icons\icon5.png,icon5.png /resource:src\icons\icon6.png,icon6.png /resource:src\icons\icon7.png,icon7.png /out:RamSpirit.exe src\RamSpirit.cs
          if not exist RamSpirit.exe exit 1

      - name: 릴리스에 올리기
        shell: bash
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          V="v${{ steps.v.outputs.version }}"
          if gh release view "$V" >/dev/null 2>&1; then echo "$V 릴리스가 이미 있어요"; exit 0; fi
          # 릴리스 설명: CHANGELOG.md의 이 버전 부분 + 내려받기 안내
          awk -v v="## $V " 'index($0,v)==1{on=1; sub(/^## [^ ]+ · /,"## "); print; next} /^## v/{on=0} on' CHANGELOG.md > notes.md || true
          if [ ! -s notes.md ]; then echo "RamSpirit $V" > notes.md; fi
          printf '\n---\n**내려받기:** 아래 Assets의 `RamSpirit.exe`를 받아 실행하세요. 이미 쓰고 있다면 자동으로 업데이트돼요.\n\n전체 사용법은 [README](https://github.com/dpfkadpfka/RamSpirit#readme)에 있어요.\n' >> notes.md
          gh release create "$V" RamSpirit.exe --title "RamSpirit $V" --notes-file notes.md
