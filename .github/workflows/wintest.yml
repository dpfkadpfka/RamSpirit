# 윈도우에서 RamSpirit를 실제로 켜 보고 창이 밖으로 새는지 자동 점검 (wintest 브랜치에 올리면 실행)
name: RamSpirit 윈도우 점검

on:
  push:
    branches: [wintest]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  test:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - name: 만들기
        shell: cmd
        run: |
          set FW=%WINDIR%\Microsoft.NET\Framework64\v4.0.30319
          mkdir C:\t
          "%FW%\csc.exe" /nologo /target:winexe /optimize /codepage:65001 /win32icon:src\icon.ico /lib:"%FW%\WPF" /r:System.Windows.Forms.dll /r:System.Drawing.dll /r:WindowsBase.dll /r:UIAutomationClient.dll /r:UIAutomationTypes.dll /resource:src\icons\icon1.ico,icon1.ico /resource:src\icons\icon2.ico,icon2.ico /resource:src\icons\icon3.ico,icon3.ico /resource:src\icons\icon4.ico,icon4.ico /resource:src\icons\icon5.ico,icon5.ico /resource:src\icons\icon6.ico,icon6.ico /resource:src\icons\icon7.ico,icon7.ico /resource:src\icons\icon1.png,icon1.png /resource:src\icons\icon2.png,icon2.png /resource:src\icons\icon3.png,icon3.png /resource:src\icons\icon4.png,icon4.png /resource:src\icons\icon5.png,icon5.png /resource:src\icons\icon6.png,icon6.png /resource:src\icons\icon7.png,icon7.png /out:C:\t\RamSpirit.exe src\RamSpirit.cs
          "%FW%\csc.exe" /nologo /target:winexe /codepage:65001 /r:System.Windows.Forms.dll /r:System.Drawing.dll /out:C:\t\claude.exe test\fakeclaude.cs
          "%FW%\csc.exe" /nologo /target:winexe /codepage:65001 /r:System.Windows.Forms.dll /r:System.Drawing.dll "/out:C:\t\Grok Bot.exe" test\fakeapp.cs
          xcopy /e /i /y test\pages C:\t\pages
      - name: 준비 (가짜 Claude 앱을 시작 메뉴에, 설정 파일)
        shell: pwsh
        run: |
          $sm = "$env:APPDATA\Microsoft\Windows\Start Menu\Programs"
          $ws = New-Object -ComObject WScript.Shell
          $l = $ws.CreateShortcut("$sm\Claude.lnk"); $l.TargetPath = "C:\t\claude.exe"; $l.Save()
          $g = $ws.CreateShortcut("$sm\Grok Bot.lnk"); $g.TargetPath = "C:\t\Grok Bot.exe"; $g.Arguments = '"Grok Bot"'; $g.Save()
          New-Item -ItemType Directory -Force "$env:APPDATA\RamSpirit" | Out-Null
          Copy-Item test\apps.txt "$env:APPDATA\RamSpirit\apps.txt"
          Get-ChildItem "C:\Program Files\Google\Chrome\Application\chrome.exe"
          # 크롬 첫 실행 안내가 뜨지 않게 한 번 켰다 끔
          Start-Process "C:\Program Files\Google\Chrome\Application\chrome.exe" "--no-first-run --app=file:///C:/t/pages/grok.html"; Start-Sleep 6; Get-Process chrome -ErrorAction SilentlyContinue | Stop-Process -Force
      - name: 점검
        shell: powershell
        run: ./test/driver.ps1
      - name: 결과를 wintest-out 브랜치에 올리기
        if: always()
        shell: bash
        run: |
          mkdir -p /tmp/o && cp -r /c/t/out/. /tmp/o/ || true
          cd /tmp/o && git init -q && git checkout -q -b wintest-out && git add -A
          git -c user.name=bot -c user.email=bot@x commit -qm "run ${{ github.run_id }}"
          git push -f "https://x-access-token:${{ secrets.GITHUB_TOKEN }}@github.com/${{ github.repository }}.git" wintest-out
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: wintest
          path: C:\t\out
